name: Validate and publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Each job declares only the permissions it uses.
permissions: {}

# Serialize main runs through live verification; PRs get their own cancelable group.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_NO_PROGRESS: '1'
  PYTHONIOENCODING: utf-8
  DISABLE_TELEMETRY: '1'

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout intended revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.9.16'
          enable-cache: false
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: '1.10.19'
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked documentation dependencies
        run: uv sync --frozen
      - name: Validate skills and packaging checks
        run: |
          uv run --frozen python scripts/validate.py
          uv run --frozen python -m unittest discover -s tests -v
      - name: Build and validate documentation
        run: uv run --frozen python scripts/build_site.py
      - name: Test authored directories and project-subpath website installation
        run: uv run --frozen python scripts/smoke_install.py --source ./skills --site-dir great-docs/_site
      - name: Upload only the generated Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: great-docs/_site
          include-hidden-files: true
      - name: Download the uploaded artifact for inspection
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/downloaded-pages
      - name: Check artifact round-trip and all skill companions
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ARCHIVE: ${{ runner.temp }}/downloaded-pages/artifact.tar
        run: uv run --frozen python scripts/validate.py --site great-docs/_site --archive "$ARCHIVE"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      site_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read configured Pages metadata
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Verify this repository's project URL
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: test "$PAGES_URL" = 'https://butterlyn.github.io/engineering-skills'
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-live:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.9.16'
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: uv sync --frozen
      - name: Check live revision, JSON discovery, assets, and exact content
        env:
          SITE_URL: ${{ needs.deploy.outputs.site_url }}
          SOURCE_SHA: ${{ github.sha }}
        run: uv run --frozen python scripts/check_live.py --url "$SITE_URL" --commit "$SOURCE_SHA"
      - name: Exercise published Git and website installations
        env:
          SITE_URL: ${{ needs.deploy.outputs.site_url }}
          SOURCE_SHA: ${{ github.sha }}
        run: uv run --frozen python scripts/smoke_install.py --source "https://github.com/butterlyn/engineering-skills/tree/$SOURCE_SHA" --source "$SITE_URL"
